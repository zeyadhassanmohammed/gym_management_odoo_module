services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo17-db-data:/var/lib/postgresql/data/pgdata
    restart: always
    ports:
      - "5433:5432"

  web:
    build: .
    image: odoo-17:latest
    depends_on:
      - db
    ports:
      - "8070:8069"
    command: odoo -u gym_management
    volumes:
      - odoo17-web-data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf
      - ./addons:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    restart: always

volumes:
  odoo17-web-data:
  odoo17-db-data:
